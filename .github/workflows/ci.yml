name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify locked dependencies
        run: uv sync --locked
      - name: Compile Python modules
        run: uv run python -m compileall -q demo evaluators scripts tests
      - name: Test fixture invariants
        run: uv run python -m unittest discover -s tests -v
