[project]
name = "kitaru-claude-replay-demo"
version = "0.1.0"
description = "Record a Claude Agent SDK agent with Kitaru, replay it against a model or prompt change, and catch the regression."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.152,<0.3",
    "kitaru-claude-agent-sdk",
    "kitaru[cli,mcp,worker]>=0.25.0",
]

[tool.uv.sources]
# The adapter merged into zenml-io/kitaru on 2026-09-04 (PR 940) and is not on
# PyPI yet. Pin the merge commit so the demo stays reproducible; switch to the
# PyPI release once kitaru-claude-agent-sdk 0.1.0 ships.
kitaru-claude-agent-sdk = { git = "https://github.com/zenml-io/kitaru.git", subdirectory = "plugins/packages/claude-agent-sdk", rev = "bcef26cb0d7e2af6c1475db32064a79f842c406b" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo"]
